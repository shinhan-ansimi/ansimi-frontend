-serif" font-size="10" font-weight="400" fill="#829087">안전도 평가는 서울 지역에서 제공해요</text><rect x="73" y="310" width="244" height="34" rx="17" fill="#173E35"/><text x="91" y="332" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="500" fill="white">지도를 움직여 도착지를 맞춰주세요</text><ellipse cx="195" cy="481" rx="17" ry="6" fill="#183B36" fill-opacity="0.15"/><path d="M195 477C190 468 175 455 175 443A20 20 0 0 1 215 443C215 455 200 468 195 477Z" fill="#173E35" stroke="white" stroke-width="3"/><circle cx="195" cy="443" r="7" fill="white"/><circle cx="110" cy="571" r="18" fill="#428AE5" fill-opacity="0.15"/><circle cx="110" cy="571" r="7" fill="#428AE5" stroke="white" stroke-width="3"/><rect x="34" y="597" width="103" height="27" rx="16" fill="white"/><text x="48" y="615" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="11" font-weight="600" fill="#428AE5">출발 · 현재 위치</text><rect x="322" y="565" width="48" height="48" rx="16" fill="white"/><circle cx="346" cy="589" r="9" fill="none" stroke="#183B36" stroke-width="2"/><circle cx="346" cy="589" r="3" fill="#183B36"/><rect x="16" y="651" width="358" height="166" rx="16" fill="white"/><rect x="173" y="662" width="44" height="4" rx="2" fill="#D9E3DA"/><text x="32" y="695" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="400" fill="#78877D">선택한 도착지</text><text x="32" y="724" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" font-weight="750" fill="#183B36">안심로 24</text><text x="32" y="747" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" font-weight="400" fill="#78877D">지도 중앙 핀의 위치를 도착지로 설정해요</text><rect x="32" y="764" width="326" height="40" rx="12" fill="#173E35"/><text x="123" y="790" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" font-weight="700" fill="white">이 위치로 경로 확인</text><rect x="134" y="830" width="122" height="5" rx="3" fill="#183B36"/><rect x="0" y="54" width="390" height="790" fill="#14382E" fill-opacity="